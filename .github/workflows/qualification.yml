name: Photos qualification
on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: python3 -m venv .venv && .venv/bin/pip install -r requirements.txt
      - run: source .venv/bin/activate && bash scripts/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualification-evidence
          path: |
            artifacts/*.xcresult
            artifacts/summary.json
            artifacts/report.html
            artifacts/fixtures/manifest.json
