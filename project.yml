name: PhotosLab
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
targets:
  PhotosLab:
    type: application
    platform: iOS
    sources: [Sources/PhotosLab]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.portfolio.PhotosLab
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Read test photo fixtures
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Create test albums
  PhotosLabTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/PhotosLabTests]
    dependencies:
      - target: PhotosLab
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  PhotosLabUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/PhotosLabUITests]
    dependencies:
      - target: PhotosLab
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PhotosLab:
    build:
      targets:
        PhotosLab: all
    test:
      targets: [PhotosLabTests, PhotosLabUITests]
